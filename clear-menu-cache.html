<!doctype html>
<html>
  <head>
    <title>Clear TITANE Menu Cache</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        color: white;
      }
      .container {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        padding: 3rem;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 600px;
      }
      h1 {
        margin: 0 0 1.5rem;
        font-size: 2rem;
      }
      button {
        background: #fff;
        color: #667eea;
        border: none;
        padding: 1rem 2rem;
        font-size: 1.1rem;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        margin: 0.5rem;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      }
      button:active {
        transform: translateY(0);
      }
      .success {
        background: #10b981;
        color: white;
        padding: 1rem;
        border-radius: 10px;
        margin-top: 1.5rem;
        display: none;
      }
      .info {
        background: rgba(255, 255, 255, 0.2);
        padding: 1rem;
        border-radius: 10px;
        margin-top: 1rem;
        font-size: 0.9rem;
      }
      code {
        background: rgba(0, 0, 0, 0.3);
        padding: 0.2rem 0.5rem;
        border-radius: 5px;
        font-family: 'Courier New', monospace;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🧹 Clear TITANE Menu Cache</h1>
      <p>
        Cliquez pour supprimer la configuration menu en cache et forcer le reload depuis
        le code source.
      </p>

      <button onclick="clearCache()">🗑️ Clear Cache + Reload</button>
      <button onclick="clearAll()">💣 Clear ALL LocalStorage</button>

      <div class="success" id="success">✅ Cache supprimé! Rechargement...</div>

      <div class="info">
        <strong>Items qui seront supprimés:</strong><br />
        <code>titane_menu_config</code><br />
        <code>titane_menu_sections</code><br />
        <code>menu_config</code><br />
        <code>navigation_config</code>
      </div>
    </div>

    <script>
      function clearCache() {
        // Clear menu cache items
        const itemsToRemove = [
          'titane_menu_config',
          'titane_menu_sections',
          'menu_config',
          'navigation_config',
        ];

        itemsToRemove.forEach(key => {
          localStorage.removeItem(key);
          console.log('✅ Removed:', key);
        });

        document.getElementById('success').style.display = 'block';

        setTimeout(() => {
          window.location.href = 'http://localhost:1420';
        }, 1000);
      }

      function clearAll() {
        if (
          confirm(
            '⚠️ Supprimer TOUT le localStorage?\n\nCela va effacer:\n- Config menu\n- Préférences utilisateur\n- Tokens\n- Toutes les données locales\n\nContinuer?'
          )
        ) {
          localStorage.clear();
          document.getElementById('success').style.display = 'block';
          document.getElementById('success').textContent =
            '✅ Tout le localStorage supprimé! Rechargement...';

          setTimeout(() => {
            window.location.href = 'http://localhost:1420';
          }, 1000);
        }
      }

      // Log current localStorage on load
      console.log('📊 Current localStorage keys:', Object.keys(localStorage));

      // Auto-display cached menu config if exists
      const cachedMenu = localStorage.getItem('titane_menu_config');
      if (cachedMenu) {
        console.log('🔍 Cached menu config found:', JSON.parse(cachedMenu));
      }
    </script>
  </body>
</html>
