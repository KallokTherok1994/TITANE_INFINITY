    <!-- ⭐ PHASE 2: BOOT DIAGNOSTIC MARKER (SAFE, INLINE, NO CSP BYPASS) -->
    <script>
      window.__TITANE_BOOT__ = window.__TITANE_BOOT__ || {};
      window.__TITANE_BOOT__.html_ok = true;
      window.__TITANE_BOOT__.html_timestamp = Date.now();

      var pushBootError = function (payload) {
        try {
          var existing = [];
          try {
            var raw = window.localStorage.getItem('TITANE_BOOT_ERR');
            if (raw) existing = JSON.parse(raw);
          } catch {
            existing = [];
          }
          existing.push(payload);
          window.localStorage.setItem('TITANE_BOOT_ERR', JSON.stringify(existing));
          window.localStorage.setItem('titane_boot_errors', JSON.stringify(existing));
        } catch {
          // ignore localStorage failures
        }
      };

      // ⚠️ DIAGNOSTIC: Send errors to Rust backend via IPC for visibility in logs
      var sendErrorToBackend = function (payload) {
        try {
          if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
            var marker = 'FRONTEND_ERROR|' + JSON.stringify(payload).substring(0, 500);
            window.__TAURI_INTERNALS__
              .invoke('boot_marker_log', { marker: marker })
              .catch(function () {
                // ignore IPC failures
              });
          }
        } catch {
          // ignore
        }
      };

      // Capture errors ASAP
      window.onerror = function (msg, url, line, col, err) {
        var payload = {
          msg: msg,
          url: url,
          line: line,
          col: col,
          err: err && err.toString(),
          name: err && err.name,
          stack: err && err.stack,
          source: 'window.onerror',
        };
        window.__TITANE_BOOT__.errors = window.__TITANE_BOOT__.errors || [];
        window.__TITANE_BOOT__.errors.push(payload);
        pushBootError(payload);
        sendErrorToBackend(payload); // ⚠️ DIAGNOSTIC: Send to Rust logs
        console.error('[BOOT-ERROR]', msg);
      };
      window.addEventListener('unhandledrejection', function (evt) {
        var reason = evt.reason;
        var payload = {
          type: 'rejection',
          reason: reason && reason.toString(),
          name: reason && reason.name,
          stack: reason && reason.stack,
          source: 'window.unhandledrejection',
        };
        window.__TITANE_BOOT__.errors = window.__TITANE_BOOT__.errors || [];
        window.__TITANE_BOOT__.errors.push(payload);
        pushBootError(payload);
        sendErrorToBackend(payload); // ⚠️ DIAGNOSTIC: Send to Rust logs
        console.error('[BOOT-REJECTION]', evt.reason);
      });

      // Anti-silence guard: if React entry never executes, avoid infinite loading splash.
      (function () {
        var BOOT_HTML_RECOVERY_ONCE_KEY = 'titane_boot_html_recovery_once';
        var isDevHost =
          window.location.protocol === 'http:' &&
          (window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1');
        var BOOT_HTML_GUARD_TIMEOUT_MS = isDevHost ? 120000 : 15000;

        var clearRecoveryGuard = function () {
          try {
            window.sessionStorage.removeItem(BOOT_HTML_RECOVERY_ONCE_KEY);
          } catch {
            // ignore
          }
        };

        window.addEventListener('titane:boot-ready', clearRecoveryGuard, { once: true });

        window.setTimeout(function () {
          try {
            var boot = window.__TITANE_BOOT__ || {};
            var entryTsStarted = Boolean(boot.entry_ts);
            var mainTsxStarted = Boolean(boot.main_tsx);
            var ready = Boolean(window.__TITANE_BOOT_READY__);
            var splash = document.querySelector('.loading-splash');

            if (entryTsStarted || mainTsxStarted || ready || !splash) {
              if (ready) {
                clearRecoveryGuard();
              }
              return;
            }

            var recoveryAlreadyAttempted = false;
            try {
              recoveryAlreadyAttempted =
                window.sessionStorage.getItem(BOOT_HTML_RECOVERY_ONCE_KEY) === '1';
            } catch {
              recoveryAlreadyAttempted = false;
            }

            if (!recoveryAlreadyAttempted) {
              try {
                window.sessionStorage.setItem(BOOT_HTML_RECOVERY_ONCE_KEY, '1');
              } catch {
                // ignore
              }
              console.error(
                '[BOOT_HTML_GUARD] React entry not started after ' +
                  BOOT_HTML_GUARD_TIMEOUT_MS +
                  'ms. Reloading once.'
              );
              window.location.reload();
              return;
            }

            splash.innerHTML =
              "<div style='display:flex;flex-direction:column;gap:0.75rem;align-items:center;max-width:680px;text-align:center'>" +
              "<div style='font-size:1.15rem;font-weight:700;color:#fca5a5'>Chargement bloqué (entrée React non initialisée)</div>" +
              "<div style='font-size:0.95rem;color:#cbd5e1'>Le noyau backend est lancé, mais l'interface n'a pas terminé son bootstrap frontend.</div>" +
              "<button id='titane-html-guard-reload' style='padding:0.5rem 0.9rem;border-radius:8px;border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.08);color:#fff;cursor:pointer'>Relancer l'interface</button>" +
              '</div>';

            var btn = document.getElementById('titane-html-guard-reload');
            if (btn) {
              btn.addEventListener('click', function () {
                window.location.reload();
              });
            }

            console.error(
              '[BOOT_HTML_GUARD] Infinite loading prevented (manual recovery mode).'
            );
          } catch (e) {
            console.error('[BOOT_HTML_GUARD_ERR]', e);
          }
        }, BOOT_HTML_GUARD_TIMEOUT_MS);
      })();
    </script>
