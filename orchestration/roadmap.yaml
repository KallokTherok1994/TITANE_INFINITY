## 🔧 Using This Roadmap

### For Copilot Conductor
```
Check orchestration/roadmap.yaml for current phase and task.
Delegate to subagents based on task type (audit/implement/review).
Update status after each task completion.
```

### For Manual Development
```
1. Find your task in the roadmap
2. Check dependencies in "Dependencies" column
3. Create implementation plan in plans/
4. Use TDD workflow (tests → code → refactor)
5. Run full test suite before commit
6. Update roadmap status
```

### For Progress Tracking
```
cd orchestration
npm run status              # Show overall progress
npm run next               # Find next task
npm run update -- P3-1-1   # Mark task complete
```
