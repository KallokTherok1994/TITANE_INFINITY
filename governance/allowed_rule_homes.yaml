version: 1
rules:
  - id: build-all-command
    pattern: BUILD ALL
    canonical_home: .github/copilot-instructions.md
  - id: on-demand-build
    pattern: on demand
    canonical_home: .github/copilot-instructions.md
  - id: status-vocabulary
    pattern: PASS / FAIL / BLOCKED
    canonical_home: .github/copilot-instructions.md
  - id: local-first-marker
    pattern: Local-first
    canonical_home: .github/copilot-instructions.md
  - id: autoheal-canonical-path
    pattern: scripts/autoheal/autoheal_rules.jsonl
    canonical_home: .github/copilot-instructions.md
