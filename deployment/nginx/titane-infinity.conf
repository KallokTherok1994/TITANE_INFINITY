# TITANE INFINITY v26.1 - Production Nginx Configuration
# Full deployment with admin access
# Date: 2024-12-17

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name titane-infinity.local;  # MODIFIER avec votre domaine
    
    # Force HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS Main Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name titane-infinity.local;  # MODIFIER avec votre domaine
    
    # ========================================
    # SSL CONFIGURATION
    # ========================================
    
    # Certificats SSL (Let's Encrypt recommandé)
    # Générer avec: sudo certbot --nginx -d votre-domaine.com
    ssl_certificate /etc/letsencrypt/live/titane-infinity.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titane-infinity.local/privkey.pem;
    
    # SSL moderne (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL session cache (performance)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # OCSP Stapling (sécurité + performance)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/titane-infinity.local/chain.pem;
    
    # ========================================
    # APPLICATION ROOT
    # ========================================
    
    root /var/www/html/titane-infinity;
    index index.html;
    
    # Charset UTF-8
    charset utf-8;
    
    # ========================================
    # COMPRESSION BROTLI + GZIP (CRITIQUE v26.0)
    # ========================================
    
    # Brotli (prioritaire, -14.4% vs gzip)
    brotli on;
    brotli_static on;  # Servir fichiers .br pré-compressés
    brotli_comp_level 6;
    brotli_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        font/truetype
        font/opentype
        font/woff
        font/woff2
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon;
    
    # Gzip fallback (navigateurs anciens < 5%)
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        text/xml
        text/plain
        text/x-component
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        font/truetype
        font/opentype
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;
    
    # ========================================
    # CACHING STRATEGY (Service Worker sync)
    # ========================================
    
    # Cache statique agressif (assets versionnés avec hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;  # Performance (pas de log pour assets)
    }
    
    # Service Worker (JAMAIS cacher - critique v26.0)
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # PWA Manifest (cache 1 jour)
    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # Workbox precache manifest
    location = /precache-manifest.json {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
    }
    
    # Images WebP (Phase 6 - cache long)
    location ~* \.webp$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept";  # Content negotiation
    }
    
    # HTML (cache court avec revalidation)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # ========================================
    # SÉCURITÉ HEADERS (Production-grade)
    # ========================================
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS Protection (legacy, mais bon à avoir)
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy (modern)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy (AJUSTER selon besoins)
    # IMPORTANT: 'unsafe-inline' 'unsafe-eval' pour React dev mode
    # Production: remplacer par nonces ou hashes
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://api.openai.com wss://api.openai.com; media-src 'self' blob:; worker-src 'self' blob:; child-src 'blob:'; manifest-src 'self';" always;
    
    # HSTS (HTTP Strict Transport Security)
    # Active après premier deploy HTTPS validé
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # ========================================
    # PERFORMANCE OPTIMIZATIONS
    # ========================================
    
    # Keep-alive connections
    keepalive_timeout 65;
    
    # Sendfile optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    
    # Client body size (uploads)
    client_max_body_size 10M;
    
    # ========================================
    # LOGS
    # ========================================
    
    access_log /var/log/nginx/titane-infinity-access.log;
    error_log /var/log/nginx/titane-infinity-error.log warn;
    
    # ========================================
    # ADMIN ACCESS (Protected)
    # ========================================
    
    # Admin stats/monitoring endpoint (si disponible)
    location /admin {
        # Basic Auth protection
        auth_basic "TITANE∞ Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd-titane;
        
        # Try files ou proxy vers admin backend
        try_files $uri $uri/ /index.html;
        
        # Admin logs séparés
        access_log /var/log/nginx/titane-admin-access.log;
    }
    
    # Stats endpoint (DevTools, monitoring)
    location /stats {
        auth_basic "TITANE∞ Stats";
        auth_basic_user_file /etc/nginx/.htpasswd-titane;
        try_files $uri $uri/ /index.html;
    }
    
    # ========================================
    # HEALTH CHECK (Monitoring externe)
    # ========================================
    
    location /health {
        access_log off;
        return 200 "OK - TITANE∞ v26.1";
        add_header Content-Type text/plain;
    }
    
    # ========================================
    # DENY ACCESS (Sécurité)
    # ========================================
    
    # Deny .git, .env, etc.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny backup files
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ========================================
# ADMIN SUBDOMAIN (Optionnel - séparé)
# ========================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.titane-infinity.local;  # MODIFIER
    
    # Réutiliser certificats SSL
    ssl_certificate /etc/letsencrypt/live/titane-infinity.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/titane-infinity.local/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;  # Réutiliser SSL params
    
    root /var/www/html/titane-infinity;
    index index.html;
    
    # Auth obligatoire sur tout le subdomain
    auth_basic "TITANE∞ Administration";
    auth_basic_user_file /etc/nginx/.htpasswd-titane;
    
    # Même config cache/compression que main
    include /etc/nginx/snippets/titane-cache.conf;
    include /etc/nginx/snippets/titane-compression.conf;
    
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # Logs admin séparés
    access_log /var/log/nginx/titane-admin-access.log;
    error_log /var/log/nginx/titane-admin-error.log;
}
