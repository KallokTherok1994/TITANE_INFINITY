# TITANE∞ Docker Compose Configuration Example
# Version: 27.0.0
# Description: Déploiement simple de TITANE avec Ollama

version: '3.8'

services:
  # TITANE Application
  titane:
    image: titane/infinity:27.0.0
    container_name: titane-infinity
    restart: unless-stopped
    ports:
      - '3000:3000' # Port principal application
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - TITANE_MEMORY_DIR=/data/memory
      - TITANE_LOG_LEVEL=info
      - RUST_LOG=info
    volumes:
      - titane-data:/data
      - titane-logs:/logs
      - ./config:/config:ro
    depends_on:
      - ollama
    networks:
      - titane-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Ollama Service (Local LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: titane-ollama
    restart: unless-stopped
    ports:
      - '11434:11434'
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - titane-network
    # Décommentez si GPU NVIDIA disponible
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Prometheus (Monitoring - Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: titane-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - titane-network
    profiles:
      - monitoring

  # Grafana (Dashboards - Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: titane-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=changeme
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - titane-network
    profiles:
      - monitoring

volumes:
  titane-data:
    driver: local
  titane-logs:
    driver: local
  ollama-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  titane-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# Usage:
#
# Démarrage basique:
#   docker-compose up -d
#
# Avec monitoring:
#   docker-compose --profile monitoring up -d
#
# Logs:
#   docker-compose logs -f titane
#
# Arrêt:
#   docker-compose down
#
# Arrêt avec suppression volumes:
#   docker-compose down -v
#
# Pull des modèles Ollama:
#   docker-compose exec ollama ollama pull llama2
#   docker-compose exec ollama ollama pull codellama
