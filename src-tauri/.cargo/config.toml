# ═══════════════════════════════════════════════════════════════
# TITANE∞ RUST STRICT MODE CONFIGURATION v∞
# Transforme tous les warnings en erreurs de compilation
# ═══════════════════════════════════════════════════════════════

# RUST_MIN_STACK: prevents rustc crashes (STATUS_ACCESS_VIOLATION) on ICU4X SIMD crates (tinystr, zerotrie)
# These crates use large stack frames during monomorphization; 64MB prevents the overflow.
[env]
RUST_MIN_STACK = { value = "67108864", force = false }

[target.'cfg(all())']
# rustflags = ["-Dwarnings"]  # Temporarily disabled for development

# Alternative: Configuration au niveau workspace
# À ajouter dans Cargo.toml:
# [workspace.lints.rust]
# warnings = "deny"

# ═══════════════════════════════════════════════════════════════
# ANDROID TARGET GUARDS (STOPLINE #5)
# audio-capture (cpal) est incompatible Android sans NDK Oboe setup.
# Les builds Android mock doivent utiliser --features custom-protocol,mock
# sans audio-capture. Voir scripts android:build:mock / android:build:mock:debug.
# ═══════════════════════════════════════════════════════════════
[target.aarch64-linux-android]
# No additional flags needed — feature exclusion handled at build script level
