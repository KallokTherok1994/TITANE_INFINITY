[package]
name = "titane-infinity"
version = "19.1.0"
description = "TITANE_INFINITY v19.1.0 - Proprietary License: Unified Architecture + UI Corrections + CSS Height Fix"
authors = ["Kevin Thibault / Humain Total / TITANE Team"]
license = "SEE LICENSE.md"
repository = "https://github.com/KallokTherok1994/TITANE_INFINITY"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "protocol-asset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio = { version = "1.35", features = ["full"] }
thiserror = "1.0"
sysinfo = "0.30"

# Core dependencies (actively used)
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
once_cell = "1.19"
reqwest = { version = "0.11", features = ["json"] }
regex = "1.10"
dirs = "5.0"
dotenv = "0.15"
urlencoding = "2.1"
argon2 = "0.5"
url = "2.4"
instant-distance = "0.6.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# ═══════════════════════════════════════════════════════════════
# CPU OPTIMIZATION: Reduced compilation time in development
# ═══════════════════════════════════════════════════════════════
opt-level = 1          # Light optimization (vs 0 default) → faster execution
debug = false          # Disable debug symbols → 50% faster compilation
incremental = true     # Faster rebuilds

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = "none"  # Required for Tauri bundler to inject __TAURI_BUNDLE_TYPE
