mission: Audit all instruction layer files for conflicts, stale doctrine, and unsafe prompts
phase: PHASE_0_2_INSTRUCTION_LAYER_AUDIT

allowed_scope:
  - .github/copilot-instructions.md (read-only)
  - .github/instructions/** (read-only)
  - .github/agents/** (read-only)
  - .github/prompts/** (read-only)
  - AGENTS.md (read-only)
  - .clinerules (read-only)
  - .claude/** (read-only)
  - .vscode/** (read-only)
  - docs/nexus-v36/** (write)
  - docs/nexus-v36/proofs/** (write)

forbidden_scope:
  - src/**
  - src-tauri/**
  - package.json
  - .github/workflows/**
  - .env
  - Write to .github/**, .claude/**, .vscode/** (read-only audit)

agents:
  - 00_scope_sentinel
  - 03_instruction_layer_auditor
  - 09_security_guard
  - 11_reviewer

required_proofs:
  - List of all instruction files audited
  - Conflict report per file pair
  - Stale doctrine findings
  - Unsafe prompt findings
  - Resolution recommendations (no auto-apply)

stoplines:
  - Auto-resolving conflicts without Kevin approval
  - Deleting instruction files during audit
  - Modifying .claude/ without Kevin approval

rollback: Read-only audit. No product mutations. No rollback needed.

final_verdict_allowed:
  - PASS
  - QUALIFIED
  - FAIL
  - CONFLICT_FOUND
  - UNKNOWN
