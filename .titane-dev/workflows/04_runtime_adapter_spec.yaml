mission: Design Runtime Adapter v37 specification — spec only, no implementation
phase: PHASE_0_4_RUNTIME_ADAPTER_SPEC

allowed_scope:
  - src/** (read-only for interface inspection)
  - src-tauri/** (read-only for IPC surface inspection)
  - docs/nexus-v36/** (write for spec)
  - docs/nexus-v36/proofs/** (write)
  - .titane-dev/memory/** (read)

forbidden_scope:
  - src/** (write)
  - src-tauri/** (write)
  - package.json
  - pnpm-lock.yaml
  - Cargo.toml (modifications)
  - Cargo.lock
  - .github/workflows/**
  - IPC command registration
  - Tauri allowlist mutation
  - HTTP server creation
  - Implementation before spec approval

agents:
  - 00_scope_sentinel
  - 05_runtime_architect
  - 09_security_guard
  - 11_reviewer

required_proofs:
  - Runtime Adapter v37 Specification document
  - Interface definitions: titaneRuntime.call, tauriAdapter, httpAdapter, fallbackAdapter
  - Error taxonomy: runtimeTruth, runtimeErrors
  - Migration path from current IPC (spec only)
  - IMPLEMENTATION_BLOCKED note in spec
  - No src/ or src-tauri/ write mutations

stoplines:
  - Any implementation before Kevin approves the spec
  - IPC mutation during spec phase
  - Tauri allowlist changes during spec phase

rollback: Spec-only phase. If src/ was accidentally modified: git restore -- src/

final_verdict_allowed:
  - PASS
  - QUALIFIED
  - FAIL
  - BLOCKED_SCOPE
  - BLOCKED_UNTIL_APPROVAL
