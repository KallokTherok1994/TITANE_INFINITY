version: 2

updates:
  # pnpm dependencies (Dependabot utilise l'ecosystem npm)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - automated
      - pnpm
      - non-major
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    versioning-strategy: increase-if-necessary
    groups:
      pnpm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: monthly
      day: monday
      time: '06:00'
      timezone: 'Etc/UTC'
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - automated
      - pnpm
      - major
    commit-message:
      prefix: 'chore(deps-major)'
      include: scope
    groups:
      pnpm-major-only:
        patterns:
          - '*'
        update-types:
          - major

