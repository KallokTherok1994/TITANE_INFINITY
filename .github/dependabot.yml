version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "KallokTherok1994"
    labels:
      - dependencies
      - automated
      - npm
    commit-message:
      prefix: "chore(deps)"
      include: scope
    versioning-strategy: increase

  # Cargo dependencies
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "KallokTherok1994"
    labels:
      - dependencies
      - automated
      - rust
    commit-message:
      prefix: "chore(deps)"
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "KallokTherok1994"
    labels:
      - dependencies
      - automated
      - github-actions
    commit-message:
      prefix: "chore(deps)"
      include: scope
