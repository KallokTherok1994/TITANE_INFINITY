# P3 STABLE-BUILD GATE
# TITANE_INFINITY_PROD_CERTIFICATION_RUN_V1
# GATE: GATE_P3 = (stable_build_local == PASS && ci_stable_build == PASS && forbidden_scan == PASS)

name: '🛡️ P3-STABLE-BUILD-GATE'

on:
  push:
    branches: [main, MAIN]
  pull_request:
    branches: [main, MAIN]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p3-forbidden-scan:
    name: 'P3.3 Forbidden Files Scan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: chmod +x scripts/check_forbidden_files.sh

      - name: Execute P3.3 Forbidden Scan
        id: forbidden-scan
        run: |
          echo "🔍 P3.3_FORBIDDEN_SCAN starting..."
          ./scripts/check_forbidden_files.sh
          echo "✅ P3.3_FORBIDDEN_SCAN: PASS"

      - name: Validate manifest status
        run: |
          if [ -f "runtime/stable/manifest.json" ]; then
            SCAN_STATUS=$(jq -r '.p3_3_forbidden_scan.status // "UNKNOWN"' runtime/stable/manifest.json)
            if [ "$SCAN_STATUS" = "PASS" ]; then
              echo "✅ P3.3_FORBIDDEN_SCAN manifest status: PASS"
            else
              echo "❌ P3.3_FORBIDDEN_SCAN manifest status: $SCAN_STATUS"
              exit 1
            fi
          else
            echo "❌ runtime/stable/manifest.json not found"
            exit 1
          fi

  p3-stable-build-test:
    name: 'P3.2 Build Hardening Test'
    runs-on: ubuntu-latest
    needs: p3-forbidden-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Test stable build setup
        id: build-test
        run: |
          echo "🔧 Testing stable build configuration..."
          if [ -f "runtime/stable/build.sh" ]; then
            echo "✅ runtime/stable/build.sh exists"
            chmod +x runtime/stable/build.sh
          else
            echo "❌ runtime/stable/build.sh missing"
            exit 1
          fi

          if [ -f "runtime/stable/manifest.json" ]; then
            echo "✅ runtime/stable/manifest.json exists"
            BUILD_TARGET=$(jq -r '.build_target // "UNKNOWN"' runtime/stable/manifest.json)
            echo "📦 Build target: $BUILD_TARGET"
          else
            echo "❌ runtime/stable/manifest.json missing"
            exit 1
          fi

          echo "✅ P3.2_BUILD_HARDEN: PASS (configuration valid)"

  p3-gate-validation:
    name: '🚪 GATE_P3 Final Validation'
    runs-on: ubuntu-latest
    needs: [p3-forbidden-scan, p3-stable-build-test]
    steps:
      - name: Validate GATE_P3 conditions
        run: |
          echo "🚪 Validating GATE_P3 conditions..."
          echo "✅ forbidden_scan == PASS (completed by p3-forbidden-scan)"
          echo "✅ ci_stable_build == PASS (completed by p3-stable-build-test)"
          echo "📝 stable_build_local requires manual validation"
          echo ""
          echo "🎯 GATE_P3: CI CONDITIONS PASS"
          echo "📋 Next: Complete P3_1_STAGING + P3_2_BUILD_HARDEN locally"
          echo "📋 Then: Execute P4_CONSTITUTION_AUDIT"

  evidence-collection:
    name: '📊 P3 Evidence Collection'
    runs-on: ubuntu-latest
    needs: [p3-forbidden-scan, p3-stable-build-test]
    if: always()
    steps:
      - name: Collect P3 evidence
        run: |
          echo "📊 P3_STABLE_BUILD Evidence Collection"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Phase: P3_STABLE_BUILD"
          echo "Status: $([ '${{ needs.p3-forbidden-scan.result }}' = 'success' ] && [ '${{ needs.p3-stable-build-test.result }}' = 'success' ] && echo 'PASS' || echo 'FAIL')"
          echo ""
          echo "Components:"
          echo "- P3.1_STAGING: To be completed locally"
          echo "- P3.2_BUILD_HARDEN: ${{ needs.p3-stable-build-test.result }}"
          echo "- P3.3_FORBIDDEN_SCAN: ${{ needs.p3-forbidden-scan.result }}"
          echo "- P3.4_CI: ACTIVE (this workflow)"
