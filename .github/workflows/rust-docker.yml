name: Rust Tests (Docker)

on:
  workflow_dispatch:
  push:
    branches: [MAIN, main, dev, stable-runtime]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-docker.yml'
  pull_request:
    branches: [MAIN, main]
    paths:
      - 'src-tauri/**'

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions (least privilege)
permissions:
  contents: read

env:
  RUST_VERSION: '1.83'

jobs:
  test-rust-docker:
    name: 🦀 Rust Backend Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    container:
      image: rust:1.83-slim

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: 🔧 Install System Dependencies (Tauri/GTK)
        run: |
          apt-get update
          apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential

      - name: 💾 Cache Cargo Registry
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: 💾 Cache Cargo Build
        uses: actions/cache@v4.2.0
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-docker-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-docker-

      - name: ✔️ Run Cargo Check
        working-directory: src-tauri
        run: cargo check --verbose

      - name: 🧪 Run Rust Tests
        working-directory: src-tauri
        run: cargo test --verbose
        env:
          RUST_BACKTRACE: 1

      - name: 🔍 Run Clippy (Linter)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 📊 Generate Test Report
        if: always()
        working-directory: src-tauri
        run: |
          echo "## 🦀 Rust Tests Summary (Docker)" > test-summary.md
          echo "" >> test-summary.md
          echo "- ✅ Tests executed in isolated Docker environment" >> test-summary.md
          echo "- ✅ Full Tauri dependencies installed" >> test-summary.md
          echo "- Rust: ${{ env.RUST_VERSION }}" >> test-summary.md
          echo "- Container: rust:1.83-slim" >> test-summary.md

      - name: 📤 Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: rust-test-report-docker-${{ github.run_id }}
          path: src-tauri/test-summary.md
          retention-days: 30
