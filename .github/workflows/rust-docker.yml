name: Rust Tests (Docker)

on:
  # Déclenché manuellement ou sur push vers branches principales
  workflow_dispatch:
  push:
    branches: [MAIN, dev, stable-runtime]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/rust-docker.yml'
  pull_request:
    branches: [MAIN]
    paths:
      - 'src-tauri/**'

jobs:
  test-rust-docker:
    name: Tests Backend Rust (Docker)
    runs-on: ubuntu-latest

    # Utiliser image Docker avec dépendances système Tauri
    container:
      image: rust:1.83-slim

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Tauri/GTK)
        run: |
          apt-get update
          apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Run Cargo Check
        working-directory: src-tauri
        run: cargo check --verbose

      - name: Run Rust Tests
        working-directory: src-tauri
        run: cargo test --verbose
        env:
          RUST_BACKTRACE: 1

      - name: Run Clippy (Linter)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings
        continue-on-error: true

      - name: Generate Test Report
        if: always()
        working-directory: src-tauri
        run: |
          echo "## Rust Tests Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "✅ Cargo check: $(cargo check 2>&1 | grep -c 'Finished' || echo 'Failed')" >> test-summary.md
          echo "✅ Tests executed in Docker environment with full Tauri dependencies" >> test-summary.md

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-test-report
          path: src-tauri/test-summary.md
          retention-days: 30
