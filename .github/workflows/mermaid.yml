name: Mermaid Governance

on:
  push:
    branches: [MAIN]
  pull_request:
    branches: [MAIN]

env:
  PNPM_VERSION: '10.28.2'

jobs:
  mermaid_governance:
    name: mermaid_governance (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mermaid change request guard
        run: bash scripts/verify/mermaid-change-request-guard.sh --ci

      - name: Mermaid governance (op)
        run: pnpm run op:mermaid

      - name: Mermaid no-self-hash guard
        run: bash scripts/verify/mermaid-no-self-hash-guard.sh

      - name: Mermaid baseline guard
        run: bash scripts/verify/mermaid-baseline-guard.sh --ci

      - name: Mermaid diff intelligence
        run: bash scripts/verify/mermaid-diff-intel.sh --ci

      - name: Mermaid status report (check)
        run: bash scripts/verify/mermaid-status-report.sh --check

      - name: Mermaid drift report
        run: |
          mkdir -p reports
          bash scripts/verify/verify-mermaid-drift.sh --strict --allowlist docs/diagrams/DRIFT_ALLOWLIST.txt --report reports/mermaid_drift_report.md

      - name: Mermaid job summary
        if: always()
        run: |
          set +e
          head_sha_at_time=$(git rev-parse HEAD)
          baseline_sha=$(python3 - <<'PY'
import json
with open("docs/diagrams/MERMAID_BASELINE_LOCK.json", "r", encoding="utf-8") as handle:
    print(json.load(handle).get("baseline_sha", ""))
PY
          )
          no_self_hash=$?

          bash scripts/verify/mermaid-status-report.sh --check >/tmp/mermaid_status.txt 2>&1
          status_report=$?
          bash scripts/verify/mermaid-change-request-guard.sh --ci >/tmp/mermaid_change_guard.txt 2>&1
          change_guard=$?
          bash scripts/verify/mermaid-baseline-guard.sh --ci >/tmp/mermaid_baseline_guard.txt 2>&1
          baseline_guard=$?
          bash scripts/verify/mermaid-diff-intel.sh --ci >/tmp/mermaid_diff_intel.txt 2>&1
          diff_intel=$?
          bash scripts/verify/mermaid-no-self-hash-guard.sh >/tmp/mermaid_no_self_hash.txt 2>&1
          no_self_hash=$?
          bash scripts/verify/mermaid-hash-registry.sh --check >/tmp/mermaid_registry.txt 2>&1
          registry=$?
          bash scripts/verify/verify-mermaid-drift.sh --strict --allowlist docs/diagrams/DRIFT_ALLOWLIST.txt >/tmp/mermaid_drift.txt 2>&1
          drift=$?

          {
            echo "## Mermaid Governance Summary"
            echo
            echo "- HEAD_SHA_AT_TIME: ${head_sha_at_time}"
            echo "- Baseline SHA: ${baseline_sha}"
            echo "- Status report: $([[ $status_report -eq 0 ]] && echo PASS || echo FAIL)"
            echo "- Drift strict: $([[ $drift -eq 0 ]] && echo PASS || echo FAIL)"
            echo "- Registry check: $([[ $registry -eq 0 ]] && echo PASS || echo FAIL)"
            echo "- Change request guard: $([[ $change_guard -eq 0 ]] && echo PASS || echo FAIL)"
            echo "- Baseline guard: $([[ $baseline_guard -eq 0 ]] && echo PASS || echo FAIL)"
            echo "- Diff intelligence: $([[ $diff_intel -eq 0 ]] && echo PASS || echo FAIL)"
            echo "- No-self-hash guard: $([[ $no_self_hash -eq 0 ]] && echo PASS || echo FAIL)"
            echo "- Canon index: docs/diagrams/CANON_INDEX.md"
            echo "- Proof pack: run bash scripts/verify/mermaid-proof-pack.sh"
            echo "- No-self-hash policy: docs/diagrams/VERDICT_SHA_POLICY.md"
            if [[ -f reports/mermaid_drift_report.md ]]; then
              echo "- Drift report: reports/mermaid_drift_report.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Mermaid drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-drift-report
          path: reports/mermaid_drift_report.md
          if-no-files-found: ignore
