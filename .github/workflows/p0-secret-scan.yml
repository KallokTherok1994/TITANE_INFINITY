name: 'P0-1 Secret Scanner (BLOQUANT)'

on:
  push:
    branches: [main, MAIN, dev, stable-runtime]
  pull_request:
    branches: [main, MAIN, dev, stable-runtime]

  # Scan quotidien pour détecter dérives
  schedule:
    - cron: '0 6 * * *' # 6h UTC chaque jour

jobs:
  secret-scan:
    name: '🔒 Secret Scan (Production Certification)'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          # Scanner historique récent pour patterns secrets
          fetch-depth: 50

      - name: 'P0-1 Secret Scanner'
        run: |
          chmod +x ./scripts/security/secret-scan.sh
          ./scripts/security/secret-scan.sh
        shell: bash

      - name: 'Archive Secret Scan Evidence'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-evidence-${{ github.sha }}
          path: |
            scripts/security/secret-scan.sh
            .gitignore
          retention-days: 30
