name: TITANE Static Gates v67 - UI Desktop Determinism

# Triggers for static gate validation
on:
  push:
    branches: [MAIN, main]
    paths:
      - 'e2e/desktop/ui-desktop-*.wdio.test.js'
      - 'scripts/verify/verify-ui-desktop-*.mjs'
      - 'scripts/verify/verify-ui-*.mjs'
      - 'scripts/generate/generate-ui-*.mjs'
      - 'package.json'
      - 'src/**'
      - 'docs/ui/**'
      - '.github/workflows/titane-static-gates.yml'
  pull_request:
    branches: [MAIN, main]
  workflow_dispatch:

# Prevent concurrent runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions (read-only CI)
permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.30.2'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # STATIC GATES — UI Desktop Determinism (v67)
  # ═══════════════════════════════════════════════════════════════════════════
  ui-static-gates:
    name: 🏗️ UI Desktop Static Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────────────
      # 0. Baseline Static Quality Gates
      # ─────────────────────────────────────────────────────────────────────
      - name: check
        run: pnpm run check

      - name: lint
        run: pnpm run lint

      # ─────────────────────────────────────────────────────────────────────
      # 1. UI Surface Registry Verification
      # ─────────────────────────────────────────────────────────────────────
      - name: verify:ui-surface-registry
        run: pnpm run verify:ui-surface-registry

      # ─────────────────────────────────────────────────────────────────────
      # 2. UI Surface Documentation Generation
      # ─────────────────────────────────────────────────────────────────────
      - name: generate:ui-surface-docs
        run: pnpm run generate:ui-surface-docs

      # ─────────────────────────────────────────────────────────────────────
      # 3. UI Desktop Manifest Generation
      # ─────────────────────────────────────────────────────────────────────
      - name: generate:ui-desktop-manifest
        run: pnpm run generate:ui-desktop-manifest

      # ─────────────────────────────────────────────────────────────────────
      # 4. UI Desktop Coverage Verification
      # ─────────────────────────────────────────────────────────────────────
      - name: verify:ui-desktop-coverage
        run: pnpm run verify:ui-desktop-coverage

      # ─────────────────────────────────────────────────────────────────────
      # 5. Tauri-Only Enforcement (Ring 0 protection)
      # ─────────────────────────────────────────────────────────────────────
      - name: verify:tauri-only
        run: pnpm run verify:tauri-only

      # ─────────────────────────────────────────────────────────────────────
      # 6. Online-First Governance (One Door network enforcement)
      # ─────────────────────────────────────────────────────────────────────
      - name: verify:online-first
        run: pnpm run verify:online-first

      # ─────────────────────────────────────────────────────────────────────
      # 7. IPC Contract Verification (strict backend boundary)
      # ─────────────────────────────────────────────────────────────────────
      - name: guard:ipc-contract
        run: pnpm run guard:ipc-contract

      # ─────────────────────────────────────────────────────────────────────
      # 8. Backend Proof Depth — Strict Mode
      # ─────────────────────────────────────────────────────────────────────
      - name: verify:backend-proof-depth:strict
        run: TITANE_PROOF_ARTIFACT=artifacts/backend-proof-depth/v63-tier1-real-ipc-completion.jsonl pnpm run verify:backend-proof-depth:strict

      # ─────────────────────────────────────────────────────────────────────
      # 9. UI Desktop Main Menu Reconciliation — Sealed Artifact
      # ─────────────────────────────────────────────────────────────────────
      - name: verify:ui-desktop-main-menu-reconciliation:sealed
        run: |
          if [[ -f artifacts/ui-desktop/v64-main-menu-capture-reconciliation.jsonl ]]; then
            echo "Sealed artifact found: running blocking verifier"
            pnpm run verify:ui-desktop-main-menu-reconciliation:sealed
          else
            echo "SKIP: sealed artifact not present in checkout context"
          fi

      # ─────────────────────────────────────────────────────────────────────
      # 10. AutoHeal Recurrence Detection (governance registry)
      # ─────────────────────────────────────────────────────────────────────
      - name: Detect AutoHeal Recurrence
        run: bash scripts/autoheal/detect_recurrence.sh

      # ─────────────────────────────────────────────────────────────────────
      # 11. Instruction Verification (Copilot agent rules)
      # ─────────────────────────────────────────────────────────────────────
      - name: CI environment preflight for instruction validators
        run: bash scripts/verify/ci-env-preflight.sh

      - name: Verify Copilot Instructions
        run: bash scripts/verify_instructions.sh

      # ─────────────────────────────────────────────────────────────────────
      # Summary and Status
      # ─────────────────────────────────────────────────────────────────────
      - name: 📊 Static Gates Summary
        if: always()
        run: |
          echo "## 🏗️ TITANE Static Gates v67 Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Baseline Quality" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ check" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ lint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### UI Surface Verification" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ verify:ui-surface-registry" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ generate:ui-surface-docs" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ generate:ui-desktop-manifest" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ verify:ui-desktop-coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Architecture Governance" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ verify:tauri-only (Ring 0 protection)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ verify:online-first (One Door enforcement)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ guard:ipc-contract (IPC boundary)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ verify:backend-proof-depth:strict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Determinism (v67)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ verify:ui-desktop-main-menu-reconciliation:sealed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Governance Registry" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ detect_recurrence.sh (AutoHeal)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ verify_instructions.sh (Copilot)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** All static gates completed" >> $GITHUB_STEP_SUMMARY
