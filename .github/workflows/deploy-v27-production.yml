name: 🚀 Auto-Deploy v29.0.0-STABLE

on:
  push:
    branches:
      - MAIN
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target (local/staging/production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

env:
  RUST_BACKTRACE: full
  NODE_ENV: production
  PNPM_VERSION: '10.30.2'

jobs:
  validate:
    name: 🔍 Validate Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Get version info
        id: version
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | grep -oP '\d+\.\d+\.\d+')
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION @ $COMMIT"

      - name: 📦 Validate stable artifacts exist
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEPLOY_DIR="deployment/latest"
          ls -lh "$DEPLOY_DIR/Titan-Stable_${VERSION}_amd64.deb"
          ls -lh "$DEPLOY_DIR/Titan-Stable_${VERSION}_amd64.AppImage"

  test:
    name: 🧪 Run Final100 Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install native dependencies (tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install native dependencies (build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run verify:final100
        run: pnpm run verify:final100

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            coverage/
            test-results/

  build-and-publish:
    name: 📦 Build & Publish Artifacts
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpng-dev libasound2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable/v1
        with:
          toolchain: stable

      - name: 🛠️ Build stable V29 bundles
        run: |
          export GO_FOR_PROD_BUILD__TITANE_INFINITY=GO_FOR_PROD_BUILD__TITANE_INFINITY
          export TITANE_BUILD_ASSUME_YES=1
          bash runtime/stable/build.sh

      - name: 📋 Verify built stable artifacts
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ls -lh "runtime/stable/Titan-Stable_${VERSION}_amd64.deb"
          ls -lh "runtime/stable/Titan-Stable_${VERSION}_amd64.AppImage"

      - name: 📎 Upload deployment artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Titan-Stable-${{ needs.validate.outputs.version }}-bundles
          path: |
            runtime/stable/Titan-Stable_${{ needs.validate.outputs.version }}_amd64.deb
            runtime/stable/Titan-Stable_${{ needs.validate.outputs.version }}_amd64.AppImage

      - name: 📤 Create/Update Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            runtime/stable/Titan-Stable_${{ needs.validate.outputs.version }}_amd64.deb
            runtime/stable/Titan-Stable_${{ needs.validate.outputs.version }}_amd64.AppImage
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}

      - name: 📢 Post deployment status
        run: |
          echo "✅ DEPLOYMENT COMPLETE"
          echo "Version: ${{ needs.validate.outputs.version }}"
          echo "Commit: ${{ needs.validate.outputs.commit }}"

  notify:
    name: 🔔 Notify Status
    runs-on: ubuntu-latest
    needs: [validate, test, build-and-publish]
    if: always()
    steps:
      - name: Determine status
        run: |
          if [ "${{ needs.validate.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             { [ "${{ needs.build-and-publish.result }}" = "success" ] || [ "${{ needs.build-and-publish.result }}" = "skipped" ]; }; then
            echo "✅ DEPLOYMENT SUCCESSFUL"
            exit 0
          else
            echo "❌ DEPLOYMENT FAILED"
            exit 1
          fi

      - name: 📝 Log deployment
        run: |
          echo "Deployment Summary:"
          echo "- Validation: ${{ needs.validate.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Build: ${{ needs.build-and-publish.result }}"
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
