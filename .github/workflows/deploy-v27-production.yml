name: 🚀 Auto-Deploy v27.0.0-PRODUCTION

on:
  push:
    branches:
      - MAIN
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target (local/staging/production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production


permissions:
  contents: read

env:
  RUST_BACKTRACE: full
  NODE_ENV: production

jobs:
  validate:
    name: 🔍 Validate Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | grep -oP '\d+\.\d+\.\d+')
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION @ $COMMIT"

      - name: 📦 Validate artifacts exist
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEPLOY_DIR="deployment/latest"
          ls -lh "$DEPLOY_DIR/TITANE-Infinity_${VERSION}_amd64.deb"
          ls -lh "$DEPLOY_DIR/TITANE-Infinity-${VERSION}-1.x86_64.rpm"
          ls -lh "$DEPLOY_DIR/TITANE-Infinity_${VERSION}_amd64.AppImage"

  test:
    name: 🧪 Run Final100 Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native dependencies (tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install native dependencies (build)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run verify:final100
        run: pnpm run verify:final100

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/

  build-and-publish:
    name: 📦 Build & Publish Artifacts
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpng-dev libasound2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 🛠️ Build Tauri bundles
        run: pnpm exec tauri build --config src-tauri/tauri.conf.json

      - name: 📋 Verify built artifacts
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          ls -lh "src-tauri/target/release/bundle/deb/TITANE-Infinity_${VERSION}_amd64.deb"
          ls -lh "src-tauri/target/release/bundle/rpm/TITANE-Infinity-${VERSION}-1.x86_64.rpm"
          ls -lh "src-tauri/target/release/bundle/appimage/TITANE-Infinity_${VERSION}_amd64.AppImage"

      - name: 📎 Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TITANE-Infinity-${{ needs.validate.outputs.version }}-bundles
          path: |
            src-tauri/target/release/bundle/deb/TITANE-Infinity_${{ needs.validate.outputs.version }}_amd64.deb
            src-tauri/target/release/bundle/rpm/TITANE-Infinity-${{ needs.validate.outputs.version }}-1.x86_64.rpm
            src-tauri/target/release/bundle/appimage/TITANE-Infinity_${{ needs.validate.outputs.version }}_amd64.AppImage

      - name: 📤 Create/Update Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/deb/TITANE-Infinity_${{ needs.validate.outputs.version }}_amd64.deb
            src-tauri/target/release/bundle/rpm/TITANE-Infinity-${{ needs.validate.outputs.version }}-1.x86_64.rpm
            src-tauri/target/release/bundle/appimage/TITANE-Infinity_${{ needs.validate.outputs.version }}_amd64.AppImage
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}

      - name: 📢 Post deployment status
        run: |
          echo "✅ DEPLOYMENT COMPLETE"
          echo "Version: ${{ needs.validate.outputs.version }}"
          echo "Commit: ${{ needs.validate.outputs.commit }}"

  notify:
    name: 🔔 Notify Status
    runs-on: ubuntu-latest
    needs: [validate, test, build-and-publish]
    if: always()
    steps:
      - name: Determine status
        run: |
          if [ "${{ needs.validate.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             { [ "${{ needs.build-and-publish.result }}" = "success" ] || [ "${{ needs.build-and-publish.result }}" = "skipped" ]; }; then
            echo "✅ DEPLOYMENT SUCCESSFUL"
            exit 0
          else
            echo "❌ DEPLOYMENT FAILED"
            exit 1
          fi

      - name: 📝 Log deployment
        run: |
          echo "Deployment Summary:"
          echo "- Validation: ${{ needs.validate.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Build: ${{ needs.build-and-publish.result }}"
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
