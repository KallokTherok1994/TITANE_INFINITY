name: 🚀 Auto-Deploy v27.0.0-PRODUCTION

on:
  push:
    branches:
      - MAIN
    tags:
      - 'v27.0.0-*'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment target (local/staging/production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  RUST_BACKTRACE: full
  NODE_ENV: production

jobs:
  validate:
    name: 🔍 Validate Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep '"version"' package.json | head -1 | grep -oP '\d+\.\d+\.\d+')
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION @ $COMMIT"

      - name: 📦 Validate artifacts exist
        run: |
          ls -lh deployment/v27.0.0-PRODUCTION/TITANE-Infinity_27.0.0_amd64.deb
          ls -lh deployment/v27.0.0-PRODUCTION/TITANE-Infinity-27.0.0-1.x86_64.rpm
          ls -lh deployment/v27.0.0-PRODUCTION/TITANE-Infinity_27.0.0_amd64.AppImage
          ls -lh deployment/v27.0.0-PRODUCTION/titane-infinity

  test:
    name: 🧪 Run Final100 Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run verify:final100
        run: pnpm run verify:final100

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/

  build-and-publish:
    name: 📦 Build & Publish Artifacts
    runs-on: ubuntu-latest
    needs: [validate, test]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 📋 Verify artifacts
        run: |
          cd deployment/v27.0.0-PRODUCTION
          sha256sum -c SHA256SUMS.txt
          echo "✅ All artifacts verified"

      - name: 📤 Create/Update Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            deployment/v27.0.0-PRODUCTION/TITANE-Infinity_27.0.0_amd64.deb
            deployment/v27.0.0-PRODUCTION/TITANE-Infinity-27.0.0-1.x86_64.rpm
            deployment/v27.0.0-PRODUCTION/TITANE-Infinity_27.0.0_amd64.AppImage
            deployment/v27.0.0-PRODUCTION/titane-infinity
            deployment/v27.0.0-PRODUCTION/SHA256SUMS.txt
          body_path: RELEASE_NOTES_v27.0.0.md
          draft: false
          prerelease: false
          tag_name: v27.0.0-PRODUCTION

      - name: 📢 Post deployment status
        run: |
          echo "✅ DEPLOYMENT COMPLETE"
          echo "Version: ${{ needs.validate.outputs.version }}"
          echo "Commit: ${{ needs.validate.outputs.commit }}"

  notify:
    name: 🔔 Notify Status
    runs-on: ubuntu-latest
    needs: [validate, test, build-and-publish]
    if: always()
    steps:
      - name: Determine status
        run: |
          if [ "${{ needs.validate.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build-and-publish.result }}" = "success" ]; then
            echo "✅ DEPLOYMENT SUCCESSFUL"
            exit 0
          else
            echo "❌ DEPLOYMENT FAILED"
            exit 1
          fi

      - name: 📝 Log deployment
        run: |
          echo "Deployment Summary:"
          echo "- Validation: ${{ needs.validate.result }}"
          echo "- Tests: ${{ needs.test.result }}"
          echo "- Build: ${{ needs.build-and-publish.result }}"
          echo "- Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
