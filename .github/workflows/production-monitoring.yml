name: '📊 Production Monitoring'

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: 'System Health Check'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Run production validation'
        run: |
          chmod +x scripts/validate_production.sh
          ./scripts/validate_production.sh

      - name: 'Check artifact integrity'
        run: |
          echo "🔐 Artifact integrity verification:"
          find deployment/latest -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "titane-infinity" \) -exec sha256sum {} \;

      - name: 'Verify constitutional compliance'
        run: |
          if [ -f scripts/check_forbidden_files.sh ]; then
            echo "🔍 Running forbidden files scan..."
            ./scripts/check_forbidden_files.sh
          fi

      - name: 'Generate health report'
        run: |
          echo "📊 Daily Health Report - $(date)"
          echo "Repository status: OK"
          echo "Artifacts: $(find deployment/latest -type f | wc -l) files"
          echo "Documentation: $(find docs/_evidence -name "*.md" | wc -l) evidence reports"
