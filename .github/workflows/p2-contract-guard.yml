# P2 CONTRACT GUARD - PROD CERTIFICATION GATE
# BLOQUANT: Vérifie cohérence invoke() frontend vs allowlist backend
name: 'P2 Contract Guard'

on:
  push:
    branches: [main, dev, MAIN]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'src-tauri/allowlist.whitelist.stable.json'
      - 'scripts/security/contract-guard.sh'
  pull_request:
    branches: [main, dev, MAIN]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
      - 'src-tauri/allowlist.whitelist.stable.json'
  workflow_dispatch:


permissions:
  contents: read

jobs:
  contract-guard:
    name: 'P2 Contract Guard Validation'
    runs-on: ubuntu-latest

    steps:
      - name: '📥 Checkout repository'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: '⚙️ Install jq for JSON processing'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq

      - name: '🔗 Run Contract Guard'
        run: |
          chmod +x ./scripts/security/contract-guard.sh
          ./scripts/security/contract-guard.sh

      - name: '📋 Create evidence artifact'
        if: always()
        run: |
          mkdir -p /tmp/contract-evidence
          echo "TIMESTAMP: $(date -Iseconds)" > /tmp/contract-evidence/contract-guard-ci-$(date +%Y%m%d-%H%M%S).txt
          echo "TRIGGER: GitHub Actions CI" >> /tmp/contract-evidence/contract-guard-ci-$(date +%Y%m%d-%H%M%S).txt
          echo "COMMIT: ${{ github.sha }}" >> /tmp/contract-evidence/contract-guard-ci-$(date +%Y%m%d-%H%M%S).txt
          echo "" >> /tmp/contract-evidence/contract-guard-ci-$(date +%Y%m%d-%H%M%S).txt
          ./scripts/security/contract-guard.sh >> /tmp/contract-evidence/contract-guard-ci-$(date +%Y%m%d-%H%M%S).txt 2>&1 || true

      - name: '🗂️ Upload evidence'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: p2-contract-guard-evidence
          path: /tmp/contract-evidence/
          retention-days: 90
