name: Capability Qualification

on:
  pull_request:
    paths:
      - 'docs/CAPABILITIES_REGISTRY.md'
      - 'docs/capabilities/**'
      - 'src-tauri/allowlist.whitelist.stable.json'
      - 'src-tauri/Cargo.toml'
      - 'tauri.base.json'
      - 'runtime/stable/**'
  push:
    branches:
      - MAIN
    paths:
      - 'docs/CAPABILITIES_REGISTRY.md'
      - 'docs/capabilities/**'
      - 'src-tauri/allowlist.whitelist.stable.json'
      - 'src-tauri/Cargo.toml'
      - 'tauri.base.json'
      - 'runtime/stable/**'
  schedule:
    - cron: '0 2 * * 1' # Lundi 2h UTC (audit hebdomadaire)

jobs:
  capability-drift-check:
    name: Capability Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check capabilities drift
        id: drift
        run: |
          echo "Vérification drift capacités..."
          bash scripts/ci/check-capabilities-drift.sh
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Block if drift detected
        if: steps.drift.outputs.exit_code != '0'
        run: |
          echo "❌ DRIFT DETECTED: Des commandes sont dans allowlist stable mais pas dans CAPABILITIES_REGISTRY.md"
          echo "Action requise: Mettre à jour docs/CAPABILITIES_REGISTRY.md ou créer fiche capacité"
          exit 1

  capability-promotion-check:
    name: Capability Promotion Check
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'promote') || contains(github.event.head_commit.message, 'STABLE')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect capability files changed
        id: detect
        run: |
          echo "Détection fichiers capacité modifiés..."
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep '^docs/capabilities/' | grep -v '_TEMPLATE.md' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "Aucun fichier capacité modifié"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Fichiers modifiés:"
            echo "$CHANGED_FILES"
            echo "files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Check promotion checklist
        if: steps.detect.outputs.skip != 'true'
        run: |
          echo "Vérification checklist promotion pour fichiers modifiés..."

          # Pour chaque fichier capacité modifié
          while IFS= read -r file; do
            if [ -z "$file" ]; then continue; fi
            
            echo "Checking $file..."
            
            # Vérifier que le fichier contient STABLE
            if ! grep -q 'Statut.*STABLE' "$file"; then
              echo "⚠️ WARNING: $file ne contient pas statut STABLE (skip)"
              continue
            fi
            
            echo "✅ $file est marqué STABLE, vérification checklist..."
            
            # Vérifier checklist promotion (section 11)
            MISSING=0
            
            # Checklist items requis
            REQUIRED_CHECKS=(
              "Fiche capacité complétée"
              "CAPABILITIES_REGISTRY mis à jour"
              "API_SURFACE mis à jour"
              "Tests contractuels PASS"
              "Smoke tests PASS"
              "Gates CI PASS"
              "Rollback documenté"
              "Observabilité OK"
              "Mode dégradé local"
              "Code review approuvé"
            )
            
            for check in "${REQUIRED_CHECKS[@]}"; do
              if ! grep -q "\[x\].*$check" "$file"; then
                echo "❌ MISSING: $check non coché dans $file"
                MISSING=$((MISSING + 1))
              fi
            done
            
            if [ $MISSING -gt 0 ]; then
              echo "❌ FAIL: $MISSING checks manquants dans checklist promotion (section 11)"
              echo "Action: Compléter checklist avant promotion STABLE"
              exit 1
            fi
            
            echo "✅ PASS: Checklist promotion complète pour $file"
          done <<< "${{ steps.detect.outputs.files }}"

          echo "✅ PASS: Toutes les promotions sont conformes"

  capability-tests:
    name: Capability-specific Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: |
          if [ ! -d ".tools/node/current" ]; then
            echo "Bundled node not found, using system node"
            npm install -g pnpm@9.15.4
          else
            export PATH="$PWD/.tools/node/current/bin:$PATH"
          fi

      - name: Install dependencies
        run: |
          export PATH="$PWD/.tools/node/current/bin:$PATH"
          pnpm install --frozen-lockfile || pnpm install --no-lockfile

      - name: Run contract tests (TS ↔ Tauri)
        run: |
          export PATH="$PWD/.tools/node/current/bin:$PATH"
          pnpm test -- --run tests/contract/tauri.contract.test.ts

      - name: Check contract tests coverage
        run: |
          # Vérifier que tous les commands stable ont un test
          echo "Vérification couverture tests contractuels..."
          bash scripts/ci/check-capabilities-drift.sh

          # Note: warnings sur tests manquants sont acceptables si couverture indirecte
          # Mais bloque si command stable n'est pas dans registry

  stable-build-validation:
    name: Stable Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential curl wget file libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libsqlite3-dev

      - name: Install pnpm
        run: |
          if [ ! -d ".tools/node/current" ]; then
            npm install -g pnpm@9.15.4
          else
            export PATH="$PWD/.tools/node/current/bin:$PATH"
          fi

      - name: Install deps
        run: |
          export PATH="$PWD/.tools/node/current/bin:$PATH"
          pnpm install --frozen-lockfile || pnpm install --no-lockfile

      - name: Build stable (dry-run)
        env:
          TITANE_BUILD_DRY_RUN: '1'
        run: |
          echo "Build stable (dry-run mode)..."
          export PATH="$PWD/.tools/node/current/bin:$PATH"

          # Build frontend
          pnpm run build

          # Check Tauri stable config
          if [ ! -f runtime/stable/tauri.conf.json ]; then
            echo "❌ FAIL: runtime/stable/tauri.conf.json manquant"
            exit 1
          fi

          # Cargo check (pas full build pour économiser temps CI)
          cd src-tauri
          cargo check --release

          echo "✅ PASS: Stable build validation OK (dry-run)"

  constitution-audit:
    name: Constitution Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run constitution audit
        run: |
          echo "Exécution constitution audit..."
          bash scripts/audit/constitution-audit.sh

      - name: Check secrets
        run: |
          echo "Vérification secrets..."
          # Vérifier qu'aucun secret n'est versionné
          if git log --all --pretty=format: -S 'sk-' | grep -q 'sk-'; then
            echo "❌ FAIL: Secret OpenAI détecté dans historique git"
            exit 1
          fi

          if git log --all --pretty=format: -S 'ghp_' | grep -q 'ghp_'; then
            echo "❌ FAIL: Token GitHub détecté dans historique git"
            exit 1
          fi

          echo "✅ PASS: No secrets detected"

  summary:
    name: Capability Qualification Summary
    runs-on: ubuntu-latest
    needs:
      [
        capability-drift-check,
        capability-tests,
        stable-build-validation,
        constitution-audit,
      ]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "=== CAPABILITY QUALIFICATION SUMMARY ==="
          echo "Drift check: ${{ needs.capability-drift-check.result }}"
          echo "Tests: ${{ needs.capability-tests.result }}"
          echo "Stable build: ${{ needs.stable-build-validation.result }}"
          echo "Constitution: ${{ needs.constitution-audit.result }}"

          if [ "${{ needs.capability-drift-check.result }}" != "success" ] || \
             [ "${{ needs.capability-tests.result }}" != "success" ] || \
             [ "${{ needs.stable-build-validation.result }}" != "success" ] || \
             [ "${{ needs.constitution-audit.result }}" != "success" ]; then
            echo "❌ CAPABILITY QUALIFICATION: FAIL"
            echo "Action: Corriger les erreurs avant merge"
            exit 1
          fi

          echo "✅ CAPABILITY QUALIFICATION: PASS"
          echo "Toutes les capacités sont qualifiées conformément au protocole"
