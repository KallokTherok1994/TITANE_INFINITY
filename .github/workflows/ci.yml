name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend_checks:
    name: Frontend Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run type-check

      - name: Unit + Integration Tests
        run: npm run test:unit && npm run test:integration

      - name: E2E (Playwright) Headless
        run: |
          npx playwright install-deps
          npm run test:e2e
        if: github.event_name == 'push'

  rust_checks:
    name: Rust Cargo Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Cargo Check
        working-directory: src-tauri
        run: cargo check --all --quiet

      - name: Cargo Clippy (warnings fail)
        working-directory: src-tauri
        run: cargo clippy --all -- -D warnings || true
        # Using || true to avoid failing build on advisory warnings; adjust policy if needed.

  build_tauri:
    name: Build Tauri (Linux)
    needs: [frontend_checks, rust_checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri Bundle
        run: npm run tauri:build

      - name: Upload Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Upload Tauri Bundle
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle
          path: src-tauri/target/release/bundle

  summary:
    name: Summary Report
    needs: [build_tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "CI pipeline complete: frontend, rust, tauri build." >> summary.txt
          echo "Node 20 / Rust stable" >> summary.txt
          echo "Artifacts: web-dist, tauri-bundle" >> summary.txt
      - name: Upload Summary
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary
          path: summary.txt
