name: CI Tests

on:
  pull_request:
    branches: [ MAIN ]
  push:
    branches: [ MAIN ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          
      - name: Install Dependencies (System)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev
            
      - name: Install Dependencies (Node)
        run: pnpm install
        
      - name: Lint Check
        run: |
          pnpm run lint || true
          pnpm run check || true
          
      - name: TypeScript Check
        run: pnpm run type-check || true
        
      - name: Unit Tests
        run: pnpm test
        
      - name: Rust Tests
        run: pnpm test:rust
        
      - name: E2E Tests (if available)
        run: pnpm test:e2e || true
        continue-on-error: true
        
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
          
      - name: Performance Baseline Check (PR only)
        if: github.event_name == 'pull_request'
        run: |
          # Run quick performance check to warn about regressions
          if [ -f "scripts/test/benchmark-performance.sh" ]; then
            echo "🔍 Running performance baseline check..."
            chmod +x scripts/test/benchmark-performance.sh
            ./scripts/test/benchmark-performance.sh || true
            
            # Compare with baseline if available
            LATEST=$(ls -t .performance-results/*.json 2>/dev/null | head -1)
            if [ -f "$LATEST" ]; then
              LAUNCH_TIME=$(jq '.metrics.launch_time_avg_s' "$LATEST")
              echo "📊 Current Launch Time: ${LAUNCH_TIME}s"
              echo "### Performance Baseline" >> $GITHUB_STEP_SUMMARY
              echo "Launch Time: ${LAUNCH_TIME}s (target: < 2.0s)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️  Performance benchmark script not found"
          fi
