name: TITANE∞ Windows MSI On-Demand

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub release tag to upload MSI assets'
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '24'
  RUST_VERSION: 'stable'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Prebuild Windows proof
        shell: pwsh
        run: |
          systeminfo
          node --version
          pnpm --version
          rustc -vV
          cargo --version
          pnpm exec tauri --version
          pnpm run sync:versions
          pnpm run verify:tauri-configs
          pnpm run verify:windows:icon
          pnpm run verify:windows:toolchain
          pnpm run verify:windows:release-readiness -- -Mode PreBuild

      - name: Build MSI + NSIS
        run: pnpm run build:windows:msi

      - name: Generate MSI proof manifests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/target/release/bundle/msi | Out-Null
          $msiFiles = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if ($msiFiles.Count -eq 0) {
            Write-Error "No MSI files generated"
            exit 1
          }
          Get-FileHash src-tauri/target/release/bundle/msi/*.msi -Algorithm SHA256 | ForEach-Object {
            "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf)
          } | Out-File src-tauri/target/release/bundle/msi/SHA256SUMS.txt -Encoding ascii
          Get-Content src-tauri/target/release/bundle/msi/SHA256SUMS.txt
          if (-not (Test-Path src-tauri/target/release/bundle/msi/SHA256SUMS.txt)) {
            Write-Error "SHA256SUMS.txt was not generated"
            exit 1
          }

          $version = node -p "require('./package.json').version"
          $primaryMsi = $msiFiles | Select-Object -First 1
          $primaryHash = (Get-FileHash -LiteralPath $primaryMsi.FullName -Algorithm SHA256).Hash.ToLower()
          $builtAt = (Get-Date).ToUniversalTime().ToString("o")
          $manifest = [ordered]@{
            platform = "windows-x64"
            version = $version
            artifact = $primaryMsi.Name
            installer_type = "wix-msi"
            github_run_id = $env:GITHUB_RUN_ID
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            sha256 = $primaryHash
            built_at = $builtAt
            local_install_proof = "NOT_CLAIMED_FROM_CI"
          }
          $runnerManifest = [ordered]@{
            runner_os = $env:RUNNER_OS
            runner_name = $env:RUNNER_NAME
            runner_arch = $env:RUNNER_ARCH
            node = (node --version)
            pnpm = (pnpm --version)
            rustc = (rustc --version)
            cargo = (cargo --version)
            tauri = (pnpm exec tauri --version)
          }
          $manifest | ConvertTo-Json -Depth 4 | Out-File src-tauri/target/release/bundle/msi/WINDOWS_MANIFEST.json -Encoding utf8
          $runnerManifest | ConvertTo-Json -Depth 4 | Out-File src-tauri/target/release/bundle/msi/WINDOWS_RUNNER_MANIFEST.json -Encoding utf8
          foreach ($required in @("WINDOWS_MANIFEST.json", "WINDOWS_RUNNER_MANIFEST.json")) {
            if (-not (Test-Path "src-tauri/target/release/bundle/msi/$required")) {
              Write-Error "$required was not generated"
              exit 1
            }
          }

          # NSIS artifact (perUser installer — no admin required)
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $nsisFiles = Get-ChildItem "$nsisDir/*.exe" -ErrorAction SilentlyContinue
          if ($nsisFiles.Count -gt 0) {
            $primaryNsis = $nsisFiles | Select-Object -First 1
            $nsisHash = (Get-FileHash -LiteralPath $primaryNsis.FullName -Algorithm SHA256).Hash.ToLower()
            "{0}  {1}" -f $nsisHash, $primaryNsis.Name |
              Add-Content src-tauri/target/release/bundle/msi/SHA256SUMS.txt -Encoding ascii
            $manifestPatched = Get-Content src-tauri/target/release/bundle/msi/WINDOWS_MANIFEST.json | ConvertFrom-Json
            $manifestPatched | Add-Member -NotePropertyName nsis_artifact -NotePropertyValue $primaryNsis.Name -Force
            $manifestPatched | Add-Member -NotePropertyName nsis_sha256   -NotePropertyValue $nsisHash         -Force
            $manifestPatched | ConvertTo-Json -Depth 4 |
              Out-File src-tauri/target/release/bundle/msi/WINDOWS_MANIFEST.json -Encoding utf8
            Write-Host "[NSIS] $($primaryNsis.Name) sha256=$nsisHash"
          } else {
            Write-Host "[NSIS] No .exe artifact found (NSIS may require NSIS toolchain on runner)"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msi-${{ github.run_number }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/SHA256SUMS.txt
            src-tauri/target/release/bundle/msi/WINDOWS_MANIFEST.json
            src-tauri/target/release/bundle/msi/WINDOWS_RUNNER_MANIFEST.json
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Optional release upload
        if: ${{ github.event.inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release exists: $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --title "TITANE∞ $RELEASE_TAG" --notes "Automated Windows MSI upload"
          fi
          find src-tauri/target/release/bundle/msi -type f \( -name "*.msi" -o -name "SHA256SUMS.txt" -o -name "WINDOWS_MANIFEST.json" -o -name "WINDOWS_RUNNER_MANIFEST.json" \) -print0 | while IFS= read -r -d '' f; do
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $msiCount = (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Measure-Object).Count
          $checksumExists = Test-Path src-tauri/target/release/bundle/msi/SHA256SUMS.txt
          $manifestExists = (Test-Path src-tauri/target/release/bundle/msi/WINDOWS_MANIFEST.json) -and (Test-Path src-tauri/target/release/bundle/msi/WINDOWS_RUNNER_MANIFEST.json)
          $nsisCount = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue | Measure-Object).Count
          $buildStatus = if ($msiCount -gt 0 -and $manifestExists) { "PASS" } else { "FAIL" }
          $checksumStatus = if ($checksumExists) { "PASS" } else { "FAIL" }
          "### Windows MSI + NSIS On-Demand" >> $env:GITHUB_STEP_SUMMARY
          "WINDOWS_MSI_BUILD=$buildStatus" >> $env:GITHUB_STEP_SUMMARY
          "WINDOWS_MSI_CHECKSUMS=$checksumStatus" >> $env:GITHUB_STEP_SUMMARY
          "LOCAL_INSTALL_PROOF=NOT_CLAIMED_FROM_CI" >> $env:GITHUB_STEP_SUMMARY
          "MSI_COUNT=$msiCount" >> $env:GITHUB_STEP_SUMMARY
          "NSIS_COUNT=$nsisCount" >> $env:GITHUB_STEP_SUMMARY
          "CHECKSUM_FILE=src-tauri/target/release/bundle/msi/SHA256SUMS.txt" >> $env:GITHUB_STEP_SUMMARY
          "GITHUB_RUN_ID=$env:GITHUB_RUN_ID" >> $env:GITHUB_STEP_SUMMARY
