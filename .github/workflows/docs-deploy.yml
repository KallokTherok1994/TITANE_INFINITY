name: Deploy Documentation

on:
  push:
    branches: [MAIN]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Prevent concurrent deployments
concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    name: 📚 Build Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - name: 🔧 Enable Corepack (pnpm)
        run: corepack enable

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 🧰 Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📖 Generate TypeDoc
        run: pnpm exec typedoc || pnpm dlx --package typedoc@0.28.14 --package typedoc-plugin-markdown@4.9.0 typedoc

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: docs

      - name: 📊 Summary
        run: |
          echo "## 📚 Documentation Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- TypeDoc generated successfully" >> $GITHUB_STEP_SUMMARY
          echo "- Output directory: \`docs/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ready for deployment" >> $GITHUB_STEP_SUMMARY

  deploy-docs:
    name: 🚀 Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🔎 Check GitHub Pages availability
        id: pages_check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")

          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        if: steps.pages_check.outputs.enabled == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
      - name: 📊 Summary (deployed)
        if: steps.pages_check.outputs.enabled == 'true'
        run: |
          echo "## 🚀 Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Live" >> $GITHUB_STEP_SUMMARY
          echo "**Build:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Summary (skipped)
        if: steps.pages_check.outputs.enabled != 'true'
        run: |
          echo "## 🚀 Documentation Deploy Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ⚠️ Skipped (GitHub Pages not enabled for this repository)" >> $GITHUB_STEP_SUMMARY
          echo "**Action:** Enable GitHub Pages in repository settings to activate deploy" >> $GITHUB_STEP_SUMMARY
