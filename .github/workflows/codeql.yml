name: CodeQL Security Analysis

on:
  push:
    branches: [MAIN, main, dev]
  pull_request:
    branches: [MAIN, main]
  schedule:
    - cron: '0 6 * * 1'  # Monday at 6 AM UTC
  workflow_dispatch:

# Prevent concurrent runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions (least privilege)
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: 🔍 CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript, typescript]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6.0.1

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: 🏗️ Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🔍 CodeQL Analysis Results (${{ matrix.language }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Language: ${{ matrix.language }}" >> $GITHUB_STEP_SUMMARY
          echo "- Query packs: security-extended, security-and-quality" >> $GITHUB_STEP_SUMMARY
          echo "- Analysis completed" >> $GITHUB_STEP_SUMMARY
