name: Rust

on:
  push:
    branches: ['MAIN']
  pull_request:
    branches: ['MAIN']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
        working-directory: src-tauri
      - name: Run tests
        run: cargo test --verbose
        working-directory: src-tauri
