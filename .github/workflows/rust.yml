name: Rust

on:
  push:
    branches: ['MAIN']
  pull_request:
    branches: ['MAIN']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libasound2-dev
      - name: Ensure frontend dist placeholder
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            echo '<!doctype html><html><body>CI placeholder</body></html>' > dist/index.html
          fi
      - name: Build
        run: cargo build --verbose
        working-directory: src-tauri
      - name: Run tests
        run: cargo test --verbose
        working-directory: src-tauri
