name: Dependency Review

on:
  pull_request:
    branches: [MAIN, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs introducing dependencies with known vulnerabilities
          fail-on-severity: moderate
          # Alert on license changes that introduce copyleft licenses
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Comment on the PR with the review summary
          comment-summary-in-pr: always
