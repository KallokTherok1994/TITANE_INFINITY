name: '🛡️ Challenger Eval Gate'
# TITANE∞ Anti-Regression Enforcement — Champion/Challenger Model
# Runs on every push/PR to MAIN.
# Any push that introduces a blocking regression on the champion baseline
# will fail CI and cannot be merged.
#
# Champion: v28.0.0 / 7973fbdec (STABLE — see evals/baselines/v1/champion_baseline.json)
# Gate script: scripts/evals/run_challenger_eval.sh
# Decision:    scripts/evals/promote_or_block.sh
# Exit codes:  0 = PASS (non-regressive)
#              1 = PROMOTION_BLOCKED (regression on ≥1 blocking metric)
#              2 = BLOCKED_INFRA (eval infrastructure error)

on:
  push:
    branches: [MAIN, main]
  pull_request:
    branches: [MAIN, main]
  workflow_dispatch:

concurrency:
  group: challenger-eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.30.2'
  RUST_VERSION: 'stable'

jobs:
  challenger-eval:
    name: '🛡️ Challenger Eval — Champion Regression Guard'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1

      - name: '⚙️ Enable Corepack (pnpm)'
        run: corepack enable

      - name: '🟢 Setup Node.js ${{ env.NODE_VERSION }}'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: '🦀 Setup Rust ${{ env.RUST_VERSION }}'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable/v1
        with:
          toolchain: stable

      - name: '📦 Cache Rust'
        uses: Swatinem/rust-cache@23bce251a8cd2ffc3c1075eaa2367cf899916d84 # v2.7.3
        with:
          workspaces: src-tauri

      - name: '🔧 Install system dependencies'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpng-dev

      - name: '📦 Install pnpm dependencies'
        run: pnpm install --frozen-lockfile

      - name: '🎭 Install Playwright browsers'
        run: pnpm exec playwright install --with-deps chromium

      - name: '🛡️ Run Challenger Eval'
        id: challenger
        run: |
          CHALLENGER_COMMIT="${{ github.sha }}"
          SHORT_SHA="${CHALLENGER_COMMIT:0:9}"
          echo "challenger_commit=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          bash scripts/evals/run_challenger_eval.sh "${SHORT_SHA}"
        env:
          CI: true

      - name: '📊 Upload Challenger Scorecard'
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: challenger-scorecard-${{ github.sha }}
          path: |
            evals/scorecards/challengers/
            reports/challenger_eval_*.log
          retention-days: 30

      - name: '📋 CI Summary'
        if: always()
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:9}"
          echo "## 🛡️ Challenger Eval Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Challenger commit | \`${SHORT_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Champion baseline | v28.0.0 / \`7973fbdec\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scorecard | \`evals/scorecards/challengers/\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          SCORECARD=$(ls evals/scorecards/challengers/CHALLENGER_${SHORT_SHA}_*.json 2>/dev/null | head -1)
          if [[ -n "$SCORECARD" ]]; then
            echo "### Blocking metric results" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$SCORECARD" >> "$GITHUB_STEP_SUMMARY" << 'PYEOF'
          import sys, json

          with open(sys.argv[1]) as f:
              sc = json.load(f)

          scores = sc.get("scores", {})
          violations = []
          passes = []

          for sc_id, metrics in scores.items():
              blocking = metrics.get("_blocking", [])
              for b in blocking:
                  v = metrics.get(b)
                  if v is not None and float(v) < 1.0:
                      violations.append(f"❌ {sc_id}.{b}: {v}")
                  elif v is not None:
                      passes.append(f"✅ {sc_id}.{b}: {v}")

          print("")
          if violations:
              print(f"**PROMOTION_BLOCKED** — {len(violations)} blocking regression(s):")
              for v in violations:
                  print(f"- {v}")
          else:
              print(f"**PASS** — {len(passes)} blocking checks, 0 regressions.")
          PYEOF
          fi

  # Governance audit: verify eval infrastructure integrity on every push
  eval-scaffold-integrity:
    name: '🔬 Eval Scaffold Integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: '🔬 verify_evals_scaffold.sh'
        run: bash scripts/verify/verify_evals_scaffold.sh

      - name: '🔬 verify_instructions.sh'
        run: bash scripts/verify_instructions.sh

      - name: '🔬 detect_recurrence.sh (autoheal integrity)'
        run: |
          # detect_recurrence.sh requires Node >=20
          # CI uses Node 22 (setup-node) — but this job has no node setup
          # Fallback: check JSONL validity with python3 only
          python3 -c "
          import json, sys
          with open('scripts/autoheal/autoheal_rules.jsonl') as f:
              lines = [l.strip() for l in f if l.strip()]
          required = ['id','date','scope','symptom','root_cause','fix','prevention_test','commands','files_changed','rollback']
          for i, line in enumerate(lines, 1):
              row = json.loads(line)
              for k in required:
                  v = row.get(k)
                  if not v or (isinstance(v, list) and len(v) == 0):
                      print(f'FAIL: {k} empty at line {i}')
                      sys.exit(1)
          print(f'PASS: {len(lines)} autoheal entries valid')
          "
