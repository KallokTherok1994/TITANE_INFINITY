name: TITANE∞ Android Build (mock/debug)

on:
  push:
    branches: [MAIN, main]
  pull_request:
    branches: [MAIN, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  android-build:
    name: 🤖 Android Build (mock/debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Setup Android SDK
        run: |
          CMDLINE_TOOLS_VERSION="11076708"
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools/latest-tmp"
          mv "$HOME/android-sdk/cmdline-tools/latest-tmp/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          rm cmdline-tools.zip
          export ANDROID_HOME="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "NDK_HOME=$HOME/android-sdk/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: 🦀 Setup Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 💾 Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          package-manager-cache: false

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build frontend (mock mode)
        run: pnpm exec vite build

      - name: 📁 Ensure dist directory exists
        run: mkdir -p dist

      - name: 🤖 Init Tauri Android
        run: pnpm exec tauri android init

      - name: 🔨 Build Android APK (mock/debug)
        run: pnpm exec tauri android build --debug --features custom-protocol,mock

      - name: 🔍 Check APK artifacts
        run: |
          echo "=== APK artifacts generated ===" >> $GITHUB_STEP_SUMMARY
          find src-tauri/gen/android -name "*.apk" 2>/dev/null | while read apk; do
            echo "- $apk: $(du -sh "$apk" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          done || echo "No APK found" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mock-debug-${{ github.run_id }}
          path: |
            src-tauri/gen/android/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 🤖 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Mode: mock/debug" >> $GITHUB_STEP_SUMMARY
          echo "- Features: custom-protocol,mock" >> $GITHUB_STEP_SUMMARY
          echo "- NDK: 26.1.10909125" >> $GITHUB_STEP_SUMMARY
          echo "- Java: 17 (Temurin)" >> $GITHUB_STEP_SUMMARY
