name: Mermaid Verify

on:
  push:
    branches: [MAIN]
  pull_request:
    branches: [MAIN]

permissions:
  contents: read

env:
  PNPM_VERSION: '10.30.2'

jobs:
  mermaid-verify:
    name: Mermaid Canon Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install native image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install --no-frozen-lockfile

      - name: Render Mermaid docs
        run: pnpm run render:docs:mermaid

      - name: Verify Mermaid docs
        run: pnpm run verify:docs:mermaid

      - name: Mermaid drift detection
        run: bash scripts/verify/verify-mermaid-drift.sh
