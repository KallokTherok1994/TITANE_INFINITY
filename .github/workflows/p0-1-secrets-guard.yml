name: P0_1_SECRETS - Secret Scan Guard
on:
  push:
    branches: [MAIN, dev, stable-runtime]
  pull_request:
    branches: [MAIN]

jobs:
  secret-scan:
    name: 🔒 P0_1_SECRETS Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Execute Secret Scanner
        run: |
          echo "🔒 [P0_1_SECRETS] TITANE∞ Secret Scanner"
          echo "========================================="

          # Execute existing secret scanner
          if [ -f "scripts/security/secret-scan.sh" ]; then
            chmod +x scripts/security/secret-scan.sh
            ./scripts/security/secret-scan.sh
          else
            echo "❌ FAIL: scripts/security/secret-scan.sh missing"
            exit 1
          fi

          # Additional P0_1_SECRETS specific checks
          echo ""
          echo "📋 P0_1_SECRETS specific validation..."

          # Check no .env files are committed (except .example)
          ENV_LEAKED=$(git ls-files | grep -E '^\.env[^.]*$' || true)
          if [ -n "$ENV_LEAKED" ]; then
            echo "❌ FAIL: .env files detected in git:"
            echo "$ENV_LEAKED"
            exit 1
          fi

          # Check docs/SECRETS.md exists
          if [ ! -f "docs/SECRETS.md" ]; then
            echo "❌ FAIL: docs/SECRETS.md missing"
            exit 1
          fi

          echo "✅ P0_1_SECRETS validation passed"

      - name: Evidence Collection
        if: always()
        run: |
          mkdir -p docs/_evidence/p0-secrets/
          {
            echo "P0_1_SECRETS Evidence - $(date -Iseconds)"
            echo "======================================"
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Commit: ${{ github.sha }}"
            echo ""
            echo "Secret Scan Results:"
            ./scripts/security/secret-scan.sh || echo "SCAN FAILED"
            echo ""
            echo "Git ls-files (env check):"
            git ls-files | grep -E '\.env' || echo "No .env files in git"
          } > docs/_evidence/p0-secrets/ci-scan-${{ github.run_id }}.txt

  gate-check:
    name: 🚨 GATE_P0_1_SECRETS
    needs: secret-scan
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate Validation
        run: |
          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "❌ GATE_P0_1_SECRETS: FAIL"
            echo "Secret scan must pass before proceeding"
            exit 1
          fi
          echo "✅ GATE_P0_1_SECRETS: PASS"
