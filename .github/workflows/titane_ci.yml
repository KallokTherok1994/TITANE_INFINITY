# TITANE∞ v20Ω - CI/CD Pipeline
# Continuous Integration for TITANE_INFINITY
#
# This workflow runs on every push and pull request to main branches.
# It performs:
# - Linting (ESLint)
# - Type checking (TypeScript)
# - Unit tests (Vitest)
# - Build verification (Vite)
# - Rust tests (Cargo)

name: TITANE∞ CI

on:
  push:
    branches: [main, MAIN, develop]
  pull_request:
    branches: [main, MAIN, develop]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # FRONTEND CHECKS
  # ═══════════════════════════════════════════════════════════════════════════
  frontend:
    name: Frontend (Lint, Type Check, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true # Don't fail on lint warnings

      - name: Run TypeScript type check
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit -- --run
        continue-on-error: true # Some tests require Tauri

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # RUST BACKEND CHECKS
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    name: Rust Backend (Check, Clippy, Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Setup Rust
        uses: dtolnay/rust-action@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust code
        working-directory: src-tauri
        run: cargo check

      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # TAURI BUILD (Linux)
  # ═══════════════════════════════════════════════════════════════════════════
  tauri-build:
    name: Tauri Build (Linux)
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        run: npm run tauri:build
        continue-on-error: true

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tauri-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # QUALITY SUMMARY
  # ═══════════════════════════════════════════════════════════════════════════
  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()

    steps:
      - name: Check job results
        run: |
          echo "## TITANE∞ CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🚀 Built with TITANE∞ v20Ω" >> $GITHUB_STEP_SUMMARY
