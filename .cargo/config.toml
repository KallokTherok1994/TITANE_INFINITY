[build]
jobs = 4
incremental = true
# rustc-wrapper strips crt_stub.o from proc-macro DLL compilations.
# crt_stub.o causes TLS conflicts when its DLL is runtime-loaded by rustc.
rustc-wrapper = "C:\\Dev\\TITANE_INFINITY\\scripts\\build\\rustc-wrapper.exe"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
