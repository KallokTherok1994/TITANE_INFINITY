[build]
# Optimisations de build pour environnement natif
jobs = 4
incremental = true

[target.x86_64-unknown-linux-gnu]
# Linking optimisé pour bibliothèques système natives
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[profile.dev]
# Mode développement optimisé
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.release]
# Production optimisée
opt-level = 3
lto = true
codegen-units = 1
strip = true
