# ═══════════════════════════════════════════════════════════════════════════
#   TITANE∞ — Ollama systemd drop-in override
#   Emplacement cible: /etc/systemd/system/ollama.service.d/titane.conf
#   ou: /etc/systemd/system/ollama-titane.service.d/titane.conf
#
#   Installer avec:
#     sudo mkdir -p /etc/systemd/system/ollama.service.d/
#     sudo cp scripts/systemd/ollama.service.d/titane.conf \
#              /etc/systemd/system/ollama.service.d/titane.conf
#     sudo systemctl daemon-reload
#     sudo systemctl restart ollama
# ═══════════════════════════════════════════════════════════════════════════

[Service]
# Variables de configuration TITANE
Environment="OLLAMA_HOST=127.0.0.1:11434"
Environment="OLLAMA_DEFAULT_MODEL=gemma2:2b"
# Keep models loaded in memory (0 = indefinitely while service running)
Environment="OLLAMA_KEEP_ALIVE=-1"

# Politique de redémarrage robuste
Restart=always
RestartSec=3
# Anti-storm: max 5 redémarrages en 2 minutes, puis abandon et alerte
StartLimitIntervalSec=120
StartLimitBurst=5

# Action en cas d'échec persistant (après StartLimitBurst dépassé)
OnFailure=

# Timeout propre
TimeoutStopSec=20
KillMode=mixed
KillSignal=SIGTERM

# Post-start: warmup des modèles requis (non-bloquant, tolère l'échec)
ExecStartPost=-/usr/bin/env bash -c '\
  sleep 5; \
  BIN=$(command -v ollama 2>/dev/null || echo ""); \
  [ -z "$BIN" ] && exit 0; \
  REPO="/home/titane-os/Documents/GitHub/TITANE_INFINITY"; \
  [ -x "$REPO/scripts/ollama/model-warmup.sh" ] && \
    bash "$REPO/scripts/ollama/model-warmup.sh" >> /tmp/ollama-warmup.log 2>&1 || true'
