# ═══════════════════════════════════════════════════════════════
#   TITANE∞ — Cloudflare Tunnel Configuration Template
#   Copy to ~/.cloudflared/titane-tunnel.yml and fill in your tunnel ID
#   Auto-generated by scripts/remote/setup-tunnel.sh
# ═══════════════════════════════════════════════════════════════

# Replace with your actual tunnel ID (from: cloudflared tunnel list)
tunnel: YOUR_TUNNEL_ID_HERE
credentials-file: /home/YOUR_USERNAME/.cloudflared/YOUR_TUNNEL_ID_HERE.json

ingress:
  # All traffic → TITANE remote gateway on localhost
  - service: http://127.0.0.1:7420

# ── Optional custom domain ────────────────────────────────────
# To use a custom domain, run:
#   cloudflared tunnel route dns titane-remote titane.yourdomain.com
# Then add the hostname entry above the catch-all:
#   - hostname: titane.yourdomain.com
#     service: http://127.0.0.1:7420
